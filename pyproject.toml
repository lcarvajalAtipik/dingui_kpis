[project]
name = "dingui-kpis"
version = "0.1.0"
description = "Análisis financiero y operativo del restaurante/discoteca Dingui (P&L, tesorería, Tipsi PoS)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "matplotlib>=3.9",
    "openpyxl>=3.1",
    "xlrd>=2.0.2",
    "gdown>=6.0.0",
    "google-cloud-bigquery>=3.41.0",
    "google-cloud-bigquery-storage>=2.38.0",
    "pandas-gbq>=0.35.0",
    "playwright>=1.61.0",
    "pypdf>=6.14.2",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ipython>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpis"]

[tool.ruff]
line-length = 100
target-version = "py311"
